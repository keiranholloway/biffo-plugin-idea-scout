name: CI

# Scaled down from biffo-template's own root .github/workflows/ci.yml. A plugin
# repo (per ADR-0003) has no Terraform of its own — Terraform, if a plugin ships
# any, is provisioned by the *consuming* project's infra, not this repo's CI.
#
# It CAN have JS/TS, contrary to the skeleton's original assumption: a
# user-facing plugin (ADR-0017/ADR-0021) ships its own frontend under web/, and
# without the job below none of it — lint, types, tests or even whether it
# builds — is checked by anything. Mirrors biffo-plugin-ideation's ci.yml.

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: '3.13'

jobs:
  lint:
    name: Lint
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # A self-hosted spot runner reclaimed mid-job leaves the job HANGING rather
    # than failing, and with no timeout it burns the 360-minute default before
    # anyone is told. On 2026-07-30 five jobs across two PRs died this way with
    # "The runner has received a shutdown signal". 20m is several times the
    # slowest job observed anywhere in this estate (Playwright E2E, 3.7m).
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type Check
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pyright

  test:
    name: Test
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: uv run pytest --cov --cov-report=xml
      - uses: codecov/codecov-action@v5
        if: always()
        with:
          files: coverage.xml

  validate-manifest:
    name: Validate biffo.plugin.json
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      # Authoritative check: load_manifest() runs the *real* Pydantic model
      # (biffo_plugin_sdk.plugin.PluginManifest) that the SDK, the Core API's
      # discover_plugin_manifests(), and `biffo plugin install` all actually
      # validate against — same reasoning cli/src/lib/plugin-manifest.ts
      # documents for why the CLI validates this way rather than against
      # registry-schema.json directly (see the next step).
      - name: Validate against the SDK's PluginManifest model (authoritative)
        run: |
          uv run python -c "
          from biffo_plugin_sdk.plugin import load_manifest
          manifest = load_manifest('biffo.plugin.json')
          print(f'OK: {manifest.name}@{manifest.version} — '
                f'{len(manifest.tables)} table(s), {len(manifest.api_routes)} route(s)')
          "
      # Advisory check, not a gate: registry-schema.json (vendored from
      # _skeletons/registry/registry-schema.json in biffo-template) is the
      # nominal marketplace registry schema, but its api_routes shape
      # predates issue #19's table/operation CRUD-synthesis redesign — it
      # still requires a free-form `handler` function-name field, and its
      # `path` regex rejects the `{id}` path parameter every single-row
      # route (read/update/delete) is required to have. A manifest that is
      # valid per the real PluginManifest model above (checked and pinned in
      # this repo's uv.lock) will therefore *fail* strict validation here —
      # confirmed directly against this template's own example manifest.
      # Run non-blocking until the registry schema is corrected upstream;
      # see README.md's "Manifest validation" section for the full story.
      - name: Validate against the vendored registry schema (advisory, non-blocking)
        continue-on-error: true
        run: |
          uv run python -m jsonschema -i biffo.plugin.json registry-schema.json

  security-secrets:
    name: Secret Scan
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      # gitleaks/gitleaks-action@v2 (what the plugin skeleton ships) does not
      # work here. Two independent problems, both of which the core project's
      # own ci.yml already solved the same way:
      #
      # 1. On this project's self-hosted runner fleet the action's SARIF upload
      #    dies with "The rootDirectory: /home/ec2-user is not a parent
      #    directory of the file: /opt/actions-runner/_work/.../results.sarif"
      #    — the scan itself passes ("no leaks found") and the job still fails.
      # 2. It requires a paid GITLEAKS_LICENSE for organization-owned repos.
      #    This repo is personal today, so it wouldn't hit that yet, but the
      #    moment it moves under an org the check breaks silently.
      #
      # Install the free, open-source gitleaks CLI directly instead. Same
      # detection, no artifact upload, no license.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      # First pass: scan git history (fetch-depth: 0 above), catching secrets
      # committed then removed within the same history.
      #
      # --log-opts is load-bearing: gitleaks' default git log arguments include
      # `--all`, so with fetch-depth: 0 the scan covers commits that live only
      # on *unmerged* branches — one bad commit on anyone's open branch then
      # reddens dev and every open PR at once, with nothing in the built ref
      # responsible for it. Scoping to HEAD restricts the scan to commits
      # reachable from the ref under test without weakening detection.
      - name: gitleaks git history scan
        run: gitleaks detect --redact -v --exit-code=2 --log-opts="--full-history HEAD"
      # Second pass: scan every file in the working tree (no-git mode), so
      # secrets sitting in files no commit under test touched are caught too.
      - name: gitleaks filesystem scan
        run: gitleaks detect --no-git --redact -v --exit-code=2

  security-deps:
    name: Dependency Audit
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-groups
      - run: sh scripts/py-dependency-audit.sh

  frontend:
    name: Frontend (lint, types, test, build)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      # Build last: a bundle that type-checks but does not build is still a
      # broken deploy, and web/dist is what the manifest's user_frontend ships.
      - run: pnpm run build

  # web-admin/ is a separate pnpm project with its own lockfile (not a workspace
  # member of web/), so it needs its own job rather than another step above.
  #
  # Its absence is how #22 happened in the other direction: the manifest declared
  # an admin UI, no CI ran against one, and nothing noticed there was no source
  # tree at all. A second frontend with no job is indistinguishable from a
  # working one.
  admin-frontend:
    name: Admin frontend (lint, types, test, build)
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web-admin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web-admin/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile --ignore-workspace
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - run: pnpm run build

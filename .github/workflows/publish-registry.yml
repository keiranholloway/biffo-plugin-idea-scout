# Publishes this plugin's entry to the Biffo plugin registry.
#
# Why this exists: the registry sat with `"plugins": []` from the day it was
# created, so the portal marketplace showed "No plugins available yet" on every
# Biffo instance while this plugin was live in production. Nobody had forgotten
# a step — there was no step. This is the step.
#
# It runs when biffo.plugin.json changes on dev, and republishes the entry from
# that manifest. Marketplace copy (description, tags, ui_components) is curated
# by hand in the registry and is deliberately preserved; version, repo,
# required_core_version and api_routes track this manifest. See
# scripts/upsert_plugin.py in the registry repo.
name: Publish to plugin registry

on:
  push:
    branches: [dev]
    paths:
      - biffo.plugin.json
  workflow_dispatch:

jobs:
  publish:
    name: Upsert registry entry
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - name: Check out this plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      # This repo is private and the registry is a different repo, so the
      # job-scoped GITHUB_TOKEN cannot reach it — a cross-repo token is the
      # only route. Warn loudly rather than failing: a missing token must not
      # red an otherwise good merge, but it must not pass silently either,
      # because silence is how the registry went stale in the first place.
      - name: Check for the registry token
        id: token
        env:
          REGISTRY_PUBLISH_TOKEN: ${{ secrets.REGISTRY_PUBLISH_TOKEN }}
        run: |
          if [ -z "${REGISTRY_PUBLISH_TOKEN}" ]; then
            echo "::warning title=Registry not updated::REGISTRY_PUBLISH_TOKEN is not set on this repository, so this plugin's entry in keiranholloway/biffo-plugins-registry was NOT updated. The portal marketplace will keep showing the previously published version. Add a token with contents:write on the registry repo to enable this."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the registry
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@v4
        with:
          repository: keiranholloway/biffo-plugins-registry
          token: ${{ secrets.REGISTRY_PUBLISH_TOKEN }}
          path: registry

      # astral-sh/setup-uv, NOT actions/setup-python. The latter fetches a
      # prebuilt interpreter from actions/python-versions, which has no build
      # matching the self-hosted runner fleet's OS — every run failed with
      # "The version '3.13' ... was not found for this operating system". uv
      # installs the interpreter itself, which is how this repo's own ci.yml
      # gets 3.13 on the same runners.
      - name: Set up Python
        if: steps.token.outputs.present == 'true'
        uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'

      - name: Upsert this plugin's entry
        if: steps.token.outputs.present == 'true'
        working-directory: registry
        run: |
          set -euo pipefail
          uv run --with jsonschema python3 scripts/upsert_plugin.py \
            --manifest "../plugin/biffo.plugin.json" \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: Commit and push
        if: steps.token.outputs.present == 'true'
        working-directory: registry
        run: |
          set -euo pipefail
          if git diff --quiet -- plugins.json; then
            echo "Registry entry already current — nothing to publish."
            exit 0
          fi
          version="$(uv run python3 -c "import json;print(json.load(open('../plugin/biffo.plugin.json'))['version'])")"
          name="$(uv run python3 -c "import json;print(json.load(open('../plugin/biffo.plugin.json'))['name'])")"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins.json
          git commit -m "feat(registry): publish ${name}@${version}"
          # Another plugin may have published between checkout and now.
          git pull --rebase origin main
          git push origin HEAD:main

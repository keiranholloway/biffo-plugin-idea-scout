name: Release

# Runs on every push of a `v*` tag: bumps/verifies the version via
# python-semantic-release, builds the sdist/wheel, and publishes to PyPI.
#
# THREE VERSIONS HAVE TO AGREE: pyproject.toml (the Python package),
# biffo.plugin.json (what the plugin registry publishes, and therefore the
# version the portal's plugin store shows), and the `v*` tag. The manifest
# one is easy to forget and fails silently — tagging v0.2.0 with a stale
# manifest gives a v0.2.0 release, a 0.2.0 package, and a store still
# advertising 0.1.0, with nothing reporting a problem. Both are checked
# below.
#
# PYPI PUBLISH IS OPT-IN: this plugin has no PyPI project or publishing
# credential, so the publish step used to run and fail on every tag. A
# release that is always red is one nobody reads, which is how a real
# failure later goes unnoticed. It is now gated on the PYPI_PUBLISH
# repository variable and skips with a notice; the distribution still ships
# on the GitHub Release. To enable: create the project, configure a trusted
# publisher (OIDC — the `id-token: write` permission below is already in
# place), then `gh variable set PYPI_PUBLISH --body true`.
#
# Note this is about *this plugin's* own distribution. The SDK it depends
# on, biffo-plugin-sdk, has its own release path upstream —
# biffo-template's .github/workflows/publish-sdk.yml, triggered by an
# `sdk-v*` tag — and its own independent semver. See README.md's
# "biffo-plugin-sdk dependency" section for what that means for `uv sync`
# before the SDK's first release lands.
#
# Prefer PyPI Trusted Publishing (OIDC) over a long-lived PYPI_API_TOKEN
# when you set this up: it needs no stored secret to rotate or leak. The
# `id-token: write` permission below is already in place for it, and
# publish-sdk.yml upstream is a worked example.
#
# biffo-template does not use semantic-release anywhere else in the
# monorepo (its own root has no release.yml — checked before writing this;
# versioning there is manual) so there's no existing in-repo pattern to
# follow. python-semantic-release is used here as the standard tool for a
# single, independently-versioned Python package driven by Conventional
# Commits (which this monorepo's own commitlint config already enforces on
# every commit message, including in this plugin repo once forked).

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write # required for PyPI trusted publishing

env:
  PYTHON_VERSION: '3.13'

jobs:
  release:
    name: Verify, Build & Release
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    # No `environment: pypi`: a job-level environment gates the WHOLE job, and
    # this job now verifies and releases whether or not it publishes. If you
    # enable PyPI and want environment protection on it, split publishing into
    # its own job (passing dist/ as an artifact) and put the environment there.
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --all-groups

      # Full CI gate re-run on the tag, not just a build — a tag push must
      # be at least as strict as a merged PR before anything is published.
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pyright
      - run: uv run pytest --cov

      - name: Determine version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Verify pyproject.toml and biffo.plugin.json match the tag
        env:
          TAG_VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          project_version="$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          manifest_version="$(python3 -c "import json; print(json.load(open('biffo.plugin.json'))['version'])")"
          failed=0
          if [ "$project_version" != "$TAG_VERSION" ]; then
            echo "::error file=pyproject.toml::pyproject.toml version ($project_version) does not match tag $GITHUB_REF_NAME"
            failed=1
          fi
          if [ "$manifest_version" != "$TAG_VERSION" ]; then
            echo "::error file=biffo.plugin.json::biffo.plugin.json version ($manifest_version) does not match tag $GITHUB_REF_NAME. The plugin registry publishes this field, so releasing with it stale would leave the portal's plugin store advertising $manifest_version."
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "pyproject.toml, biffo.plugin.json and the tag all agree on $TAG_VERSION"

      - name: Install python-semantic-release
        run: uv tool install python-semantic-release

      - name: Generate release notes
        run: semantic-release changelog

      - name: Build distribution
        run: uv build

      # PYPI PUBLISH — opt-in; see the file-level comment above.
      - name: Publish to PyPI
        if: vars.PYPI_PUBLISH == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Prefer PyPI's trusted publishing (OIDC, via the `id-token: write`
          # permission above) over a long-lived API token where possible —
          # configure a trusted publisher for this repo at
          # https://pypi.org/manage/project/<name>/settings/publishing/
          # once the project exists. Fall back to `password:
          # ${{ secrets.PYPI_API_TOKEN }}` if trusted publishing isn't set
          # up for this project yet.
          skip-existing: true

      - name: Note that PyPI publishing is not enabled
        if: vars.PYPI_PUBLISH != 'true'
        run: |
          echo "::notice title=PyPI publish skipped::The PYPI_PUBLISH repository variable is not set to 'true', so the built distribution was not uploaded to PyPI. The GitHub Release below still carries it. See this workflow's header comment to enable."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*

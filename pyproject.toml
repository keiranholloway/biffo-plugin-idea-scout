[project]
name = "biffo-plugin-idea-scout"
version = "0.1.0"
description = "Example Biffo plugin — replace this with your own plugin's name and description"
requires-python = ">=3.13"
dependencies = [
  # biffo-plugin-sdk has a real release path as of biffo-template's
  # .github/workflows/publish-sdk.yml: the package is versioned 1.0.0 and
  # publishes to PyPI (via Trusted Publishing) when an `sdk-v*` tag is
  # pushed. This pin is therefore the *correct end state* and is left as-is.
  #
  # ORDERING: the pin only resolves once the owner has actually pushed
  # `sdk-v1.0.0` and PyPI has the release. Until that first publish,
  # `uv sync` in a freshly-copied plugin repo cannot resolve it — the same
  # as before this comment was written, so nothing regressed here; what
  # changed is that the fix is now one tag push away rather than unbuilt.
  # Deliberately NOT worked around with a git/path source in the committed
  # file: baking one in would mean every plugin repo forked from this
  # skeleton silently keeps building against a moving git ref long after
  # the real release exists. Use a local `[tool.uv.sources]` override until
  # then — see the README's "biffo-plugin-sdk dependency" section, which
  # documents both options and says which to delete once 1.0.0 is live.
  "biffo-plugin-sdk[sigv4,user-serving]>=1.3,<2.0",
  "aws-lambda-powertools[tracer]>=3.4.0",
  "httpx>=0.28.1",
]

[dependency-groups]
dev = [
  "pytest>=8.3.4",
  "pytest-asyncio>=0.25.2",
  "pytest-cov>=6.0.0",
  "ruff>=0.8.0",
  "pyright>=1.1.0",
  "jsonschema>=4.23.0",
  "pip-audit>=2.7.3",
]

[tool.uv]
# `cryptography` arrives transitively — `biffo-plugin-sdk[user-serving]` pulls
# `pyjwt[crypto]`, which pulls `cryptography`. Nothing here declares it, so
# there is no floor to raise and the constraint has to be stated.
#
# CVE-2026-69247 / GHSA-g6cj-pr64-35w5 (2026-08-03): `pkcs7_decrypt_*` reported
# the outcome of unwrapping a RecipientInfo's `encryptedKey` in four
# distinguishable ways — one of them disclosing the recovered key length — and
# the same distinction was observable by timing. That is a Bleichenbacher oracle
# against the content-encryption key for anything that decrypts
# attacker-supplied EnvelopedData and answers adaptively. Introduced in 44.0.0,
# fixed in 50.0.0 (RFC 3218: the content-encryption algorithm is resolved before
# the private key is used, so every failure path does identical work).
#
# This plugin does not call the PKCS#7 APIs, so the constraint is preventative
# rather than a live exposure — but `pip-audit` reads the resolved tree, not the
# reachable code. Do not remove it as unnecessary: without it the lockfile
# resolves 49.0.0 and `scripts/py-dependency-audit.sh` reports a vulnerability.
constraint-dependencies = ["cryptography>=50.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Explicit rather than relying on hatchling's default "package name matches
# a src/ directory" heuristic — the project name (`biffo-plugin-idea-scout`)
# is a distribution/PyPI name, while `idea_scout` is the importable
# package name; they don't have to match, and won't once you rename this
# template's package to your own plugin's name. Update this path when you do.
packages = ["src/idea_scout"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "S", "UP", "ANN"]
ignore = [
  "S101", # allow assert in tests
  # ANN401 (no `Any` in annotations) fights the one place `Any` is the honest
  # answer: the Core-API seam. transport.request / adapter.Transport return
  # parsed JSON of a shape only the calling method knows, and `object` would
  # force every caller to re-narrow what it already validated. The rest of ANN
  # (missing annotations) is the valuable part and stays on.
  #
  # Note this whole `select` is stricter than the Ideation Engine's and than
  # what the instance enforces once a plugin is vendored into services/<name>/
  # — see keiranholloway/biffo-template#650, which proposes reconciling the
  # three. If that lands by dropping ANN here, this ignore goes with it.
  "ANN401",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection helpers are *designed* to be called in argument
# defaults — that call is the declaration, and moving it into the body (what
# B008 asks for) breaks the framework. Ruff supports exactly this case; the
# Ideation Engine carries the same list, and the plugin skeleton not shipping it
# is the same divergence as keiranholloway/biffo-template#650.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.Cookie",
  "fastapi.Form",
  "fastapi.File",
  "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# S101: assert is the normal pytest idiom. ANN: test functions don't need
# return-type annotations. S106: fakes.py's mock BiffoAPIClient(token=...)
# is a fixed test fixture value, not a real credential.
# S101: assert is the normal pytest idiom. ANN: test functions don't need
# return-type annotations. S105/S106/S107: fixed fake credentials in fixtures
# ("admin-token", "tok") are test data, not secrets — the Ideation Engine
# carries the same set.
"tests/**/*.py" = ["S101", "ANN", "S105", "S106", "S107"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pyright]
pythonVersion = "3.13"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
pythonpath = ["src", "tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*"]

# python-semantic-release config for release.yml. This repo does not use
# semantic-release to *create* tags (unlike its most common setup) — it's
# triggered by an already-pushed `v*` tag instead (see release.yml's header
# comment), so only `version_toml` (for the tag/pyproject.toml consistency
# check) and changelog generation are used; `semantic-release version`'s own
# commit/tag/push behavior is never invoked in CI.
[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
branch = "main"
build_command = "uv build"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
